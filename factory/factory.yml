schemaVersion: psf/v1
name: default
description: Default personal software factory.
runner: mock
mode: yolo
agents:
  triage:
    prompt: agents/triage.md
  spec:
    prompt: agents/spec.md
  implement:
    prompt: agents/implement.md
  verify:
    prompt: agents/verify.md
  review:
    prompt: agents/review.md
gates:
  spec_approval: true
  verify_quorum: 2
limits:
  max_attempts: 2
feedback:
  upstream: marcusjhang/personal-software-factory
  mode: 'auto'
classifier:
  provider: mock
  supervisor:
    enabled: false
    thresholds:
      needs_human: 0.8
      off_track: 0.8
      stuck: 0.8
      progress: 0.4
    max_steers: 1
    max_retries: 1
